# Copy to brain.yaml. Anything left out keeps its default; the reference is
# schemas/v1/brain_config.schema.json.

# How much of each tool result a chat's model sees. Sized for a small model.
max_result_chars: 12000

# How many notes to search for before a chat's first round. 0 turns it off.
recall_limit: 3
# How close in meaning a note must be to be used, from 0 to 1. This suits
# bge-m3 on short notes; measure it for your embedder. With no embedder, this
# search finds nothing to use, and the model can still search for itself.
recall_min_similarity: 0.6

# The longest one workflow run may take, in seconds.
workflow_time_limit_seconds: 1800

# The limits on each run. Give all of them, or leave the whole block out.
# max_usd_micros is 0, so a priced model isn't used until you raise it.
budget:
  max_rounds: 12
  max_tool_calls: 30
  max_writes: 8
  max_total_tokens: 200000
  max_usd_micros: 0
  max_request_bytes: 600000
  max_duration_ms: 300000

# http:
#   # GET and HEAD by default. Any other method can send data out.
#   allowed_methods: [GET, HEAD]
#   # A service on your own network, reachable even though it's private.
#   allowed_ranges: ["192.0.2.10/32"]
