# docker compose up -d runs the server: HTTP, the workers and the scheduler.
# It needs EXCOGITATE_OWNER_KEY in .env.
#
# For an MCP client that wants stdio, relay to the running server:
#   docker compose run --rm -T --no-deps session connect http://server:8080
# With the server stopped, a session can open the store itself:
#   docker compose run --rm -T session
x-excogitate: &excogitate
  build:
    context: .
    target: excogitate
    args:
      # app/neo4j adds the Neo4j store (EXCOGITATE_STORE=neo4j).
      FEATURES: ${FEATURES:-}
  image: excogitate:local
  env_file:
    - path: .env
      required: false
  extra_hosts:
    # So a model server on this machine can be reached as host.docker.internal.
    - host.docker.internal:host-gateway
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - ./models.yaml:/config/models.yaml:ro
    - ./config.yaml:/config/config.yaml:ro
    - ./definitions:/config/definitions:ro
    - data:/data

services:
  server:
    <<: *excogitate
    command: [server]
    environment:
      EXCOGITATE_BIND: 0.0.0.0:8080
    volumes:
      - ./models.yaml:/config/models.yaml:ro
      - ./config.yaml:/config/config.yaml:ro
      # Writable here, and only here: Harness² changes agent files when the
      # evidence supports it (harness.adopt in config.yaml). The container runs
      # as uid 1000, which must be able to write it.
      - ./definitions:/config/definitions
      - data:/data
    ports:
      # Only this machine can reach it. Put TLS in front before changing that.
      - 127.0.0.1:${HOST_PORT:-8080}:8080
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  session:
    <<: *excogitate
    profiles:
      - stdio
    stdin_open: true

volumes:
  data:
