# MCP runs over stdin and stdout, so each session is one `run`:
#   docker compose run --rm -T brain
# Schedules and queued jobs need the long-running worker:
#   docker compose --profile worker up -d worker
# Only one of the two can use the store at a time, until MCP moves to HTTP.
services:
  brain:
    build:
      context: .
      target: brain
    image: excogitate:local
    env_file:
      - path: .env
        required: false
    stdin_open: true
    extra_hosts:
      # So a model server on this machine can be reached as host.docker.internal.
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./models.yaml:/config/models.yaml:ro
      - ./brain.yaml:/config/brain.yaml:ro
      - ./definitions:/config/definitions:ro
      - brain-data:/data

  worker:
    extends:
      service: brain
    profiles:
      - worker
    command: [worker]
    stdin_open: false
    restart: unless-stopped
    init: true

volumes:
  brain-data:
