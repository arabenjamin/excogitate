# docker compose up -d runs the server: HTTP, the workers and the scheduler.
# It needs EXCOGITATE_OWNER_KEY in .env.
#
# For an MCP client that wants stdio, relay to the running server:
#   docker compose run --rm -T --no-deps brain connect http://server:8080
# With the server stopped, a session can open the store itself:
#   docker compose run --rm -T brain
x-brain: &brain
  build:
    context: .
    target: brain
  image: excogitate:local
  env_file:
    - path: .env
      required: false
  extra_hosts:
    # So a model server on this machine can be reached as host.docker.internal.
    - host.docker.internal:host-gateway
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - ./models.yaml:/config/models.yaml:ro
    - ./brain.yaml:/config/brain.yaml:ro
    - ./definitions:/config/definitions:ro
    - brain-data:/data

services:
  server:
    <<: *brain
    command: [server]
    environment:
      EXCOGITATE_BIND: 0.0.0.0:8080
    ports:
      # Only this machine can reach it. Put TLS in front before changing that.
      - 127.0.0.1:${BRAIN_PORT:-8080}:8080
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  brain:
    <<: *brain
    profiles:
      - stdio
    stdin_open: true

volumes:
  brain-data:
