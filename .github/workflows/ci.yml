name: CI

# Fast on a push: the quick checks need no build and fail in under a minute;
# the Rust jobs run in parallel on a shared, restore-only cache; one gate job
# is the required check, so a job skipped by the path filter never blocks a
# pull request. Actions are pinned by commit SHA.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  # CI never needs debug info; it makes the build and the cache smaller.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'plugins/**'
              - 'schemas/**'
              - 'models.example.yaml'
              - 'config.example.yaml'
              - 'definitions/**'
              - 'eval/**'
              - 'scripts/fetch_duckdb_extensions.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'deny.toml'
              - '.github/workflows/ci.yml'

  quick:
    name: Quick checks (no build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit check reads the pull request's commits
      - name: Hooks and scripts are executable
        # Git silently skips a hook that isn't executable.
        run: |
          git ls-files -s .githooks scripts/*.sh | awk '$1 != "100755" { print "not executable: " $4; bad = 1 } END { exit bad }'
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: taplo-cli@0.10.0,cargo-deny@0.20.2
      - run: taplo fmt --check
      - name: Dependency licenses, bans and sources
        run: cargo deny --locked check licenses bans sources
      - name: The name only where allowed
        run: scripts/check_name.sh
      - name: No oversized files
        run: scripts/check_file_size.sh
      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        run: scripts/check_commits.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets --all-features

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    # A scratch database for the Neo4j store's conformance cases. Required,
    # so they can't quietly skip here.
    services:
      neo4j:
        image: neo4j:5.26.21-community@sha256:409728716bc239f9fa046368ac6ce6ef280f9e5f0bcb7cdd75031a4465cc192d
        env:
          NEO4J_AUTH: neo4j/conformance-only
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p conformance-only 'RETURN 1'"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_TEST_PASSWORD: conformance-only
      NEO4J_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.150
      - name: DuckDB extensions for the store's tests
        run: scripts/fetch_duckdb_extensions.sh
      - run: cargo nextest run --locked --workspace --all-features
      - name: Doctests (nextest skips them)
        run: cargo test --locked --workspace --doc
      - name: The runtime with no plugins compiled in
        run: cargo nextest run --locked -p app --no-default-features

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: false
      - run: cargo doc --locked --workspace --no-deps --all-features

  features:
    name: Each feature set
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-hack@0.6.45
      # `check`, not `build`: no codegen, so the feature sets don't rebuild
      # the world.
      - run: cargo hack check --locked --workspace --each-feature

  compat:
    name: Compatible with the last release
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags are the baseline
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-semver-checks@0.51.0
      - name: The last release
        id: baseline
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)" >> "$GITHUB_OUTPUT"
      # A break passes only when the version is bumped past the tag's (the
      # minor before 1.0), and the changelog says so.
      - name: The plugin contract (plugin-api)
        run: cargo semver-checks -p plugin-api --baseline-rev "${{ steps.baseline.outputs.tag }}"
      - name: The published schemas
        env:
          TAG: ${{ steps.baseline.outputs.tag }}
        run: |
          base="$RUNNER_TEMP/baseline"
          mkdir -p "$base"
          git archive "$TAG" schemas/v1 | tar -x -C "$base"
          cargo run --locked -p schema-gen -- --against "$base/schemas/v1" --since "$TAG"

  gate:
    name: CI gate
    # The one required check. It passes when every job passed or was skipped
    # by the path filter, and fails when any failed or was cancelled.
    if: always()
    needs: [changes, quick, clippy, test, docs, features, compat]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
