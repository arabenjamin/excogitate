name: Done-test

# The quickstart, run for real. It builds the release image, so it runs on
# main and nightly, not on each pull request. Actions are pinned by commit SHA.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  done-test:
    name: Done-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          # As scripts/done_test.sh builds it: the Neo4j store compiled in.
          FEATURES: app/neo4j
        with:
          files: |
            compose.yaml
            tests/done/compose.yaml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Run it
        env:
          DONE_TEST_NO_BUILD: "1"
        run: scripts/done_test.sh
