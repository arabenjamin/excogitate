name: Dependency audit

# Advisories on a schedule, not on each push: an advisory published today
# says nothing about the commit being pushed, so it shouldn't block it. A red
# run here is a task, not a broken build.
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: ["Cargo.lock", "deny.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories
