# Fuzzing needs nightly, so this is its own workspace, run only by the
# scheduled fuzz workflow, never on a push.
[package]
name = "fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
dispatch = { path = "../crates/dispatch" }
libfuzzer-sys = "0.4"
model = { path = "../crates/model" }
tools = { path = "../crates/tools" }

[[bin]]
name = "parse_chat"
path = "fuzz_targets/parse_chat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "first_json_object"
path = "fuzz_targets/first_json_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tool_arguments"
path = "fuzz_targets/tool_arguments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "readable_text"
path = "fuzz_targets/readable_text.rs"
test = false
doc = false
bench = false
