        required: false
        schema:
          maximum: 200
          minimum: 1
          type: integer
      - description: How many to skip first.
        in: query
        name: offset
        required: false
        schema:
          maximum: 4294967295
          minimum: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
          description: A page of jobs.
        4XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Refused: the request, the key, or what it names. The body says why."
        5XX:
          content:
            application/json:
