          minimum: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptList"
          description: A page of attempts.
        4XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Refused: the request, the key, or what it names. The body says why."
        5XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: The server failed, or is busy. The body says which.
      security:
      - bearer:
        - read
      summary: The attempts, newest first
    post:
      operationId: start_attempt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStarted"
          description: The job was queued.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: The body is over 8 MiB.
        4XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Refused: the request, the key, or what it names. The body says why."
        5XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: The server failed, or is busy. The body says which.
      security:
      - bearer:
        - admin
      summary: Start a Harness² attempt, as a job
  "/api/v1/harness/attempts/{id}":
    get:
      operationId: get_attempt
      parameters:
      - description: Its id, a UUID.
        in: path
