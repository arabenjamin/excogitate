        5XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: The server failed, or is busy. The body says which.
      security:
      - bearer:
        - read
      summary: The agents and workflows Harness² leaves alone
  "/api/v1/harness/holds/{agent}":
    delete:
      operationId: release
      parameters:
      - description: The agent, or the workflow when target is workflow.
        in: path
        name: agent
        required: true
        schema:
          pattern: ^[a-z0-9_-]{1,64}$
          type: string
      - description: Whether the name is an agent's or a workflow's. agent if left out.
        in: query
        name: target
        required: false
        schema:
          enum:
          - agent
          - workflow
          type: string
      responses:
        "204":
          description: Released.
        4XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Refused: the request, the key, or what it names. The body says why."
        5XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: The server failed, or is busy. The body says which.
