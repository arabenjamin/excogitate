                          type: integer
                        id:
                          type: string
                        object:
                          const: model
                        owned_by:
                          type: string
                      required:
                      - id
                      - object
                      - created
                      - owned_by
                      type: object
                    maxItems: 1
                    minItems: 1
                    type: array
                  object:
                    const: list
                required:
                - object
                - data
                type: object
          description: An OpenAI model list.
        4XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Refused: the request, the key, or what it names. The body says why."
        5XX:
