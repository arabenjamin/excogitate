                required:
                - error
                - receipt
                type: object
          description: The server failed, or is busy. The body says which.
      security:
      - bearer:
        - chat
      summary: >-
        Chat, as the OpenAI chat completions API. The last message must be the user's,
        and say something.
  /v1/models:
    get:
      operationId: list_models
      responses:
        "200":
