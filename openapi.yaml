# Generated by schema-gen from the runtime's route table; don't edit.
components:
  schemas:
    Adoption:
      additionalProperties: false
      description: Whether a supported edit was adopted.
      properties:
        adopted:
          description: True if the agent's file was changed.
          type: boolean
        change_id:
          description: The change, if there is one.
          maxLength: 36
          type:
          - string
          - "null"
        reason:
          description: Why, in a sentence.
          maxLength: 2048
          type: string
      required:
      - adopted
      - reason
      type: object
    ApiError:
      additionalProperties: false
      description: Why the API refused or failed a request.
      properties:
        kind:
          description: What sort of problem it is.
          maxLength: 32
          type: string
        message:
          description: What went wrong.
          maxLength: 2048
          type: string
        problems:
          description: Each thing wrong with the request, if it didn't meet its schema.
          items:
            $ref: "#/components/schemas/ProblemView"
          maxItems: 16
          type: array
      required:
      - kind
      - message
      - problems
      type: object
    ArgumentMatch:
      additionalProperties: false
      description: |-
        What one of a call's arguments says, as a guardrail's `deny` refuses it
        or its `action` picks the calls it's about.
      properties:
        argument:
          description: The argument, as a dotted path such as `operation` or `filter.kind`.
          maxLength: 128
          minLength: 1
          type: string
        matches:
          description: |-
            A pattern that ignores case. A string is matched as it is, anything
            else as JSON. A call without the argument doesn't match.
          maxLength: 256
          minLength: 1
          type: string
      required:
      - argument
      - matches
      type: object
    Attempt:
      additionalProperties: false
      description: One attempt to improve an agent.
      properties:
        adoption:
          anyOf:
          - $ref: "#/components/schemas/Adoption"
          - type: "null"
          description: What became of a supported edit, once the system looked at adopting it.
        base_harness:
          description: The agent's harness when it started.
          maxLength: 64
          type:
          - string
          - "null"
        candidates:
          description: What the editor proposed.
          items:
            $ref: "#/components/schemas/Candidate"
          maxItems: 3
          type: array
        chosen:
          description: The candidate the evidence supports, for `supported`.
          maxLength: 4
          type:
          - string
          - "null"
        composer_model:
          description: |-
            The model the composer ran on. Only a model that passed its known-answer
            test may have its decisions adopted.
          maxLength: 256
          type:
          - string
          - "null"
        cost_usd_micros:
          description: "What the attempt cost: its probes and its judges."
          minimum: 0
          type: integer
        decision:
          anyOf:
          - $ref: "#/components/schemas/Decision"
          - type: "null"
          description: What the composer decided.
        finished_at:
          description: When it ended.
          format: date-time
          type: string
        lessons_shown:
          default: []
          description: The changes whose lessons the editor was shown.
          items:
            maxLength: 36
            type: string
          maxItems: 3
          type: array
        problems:
          description: What the code refused or what went wrong, in order.
          items:
            maxLength: 2048
            type: string
          maxItems: 32
          type: array
        reason:
          description: Why, as the composer put it.
          maxLength: 1000
          type:
          - string
          - "null"
        reference:
          anyOf:
          - $ref: "#/components/schemas/Probed"
          - type: "null"
          description: The agent as it is, on the task.
        replay:
          anyOf:
          - $ref: "#/components/schemas/Replay"
          - type: "null"
          description: |-
            The supported candidate replayed on other recent tasks, before it's
            adopted.
        request:
          $ref: "#/components/schemas/Request"
          description: What was asked.
        started_at:
          description: When it started.
          format: date-time
          type: string
        status:
          description: How it ended.
          oneOf:
          - const: kept
            description: The evidence supports no change.
            type: string
          - const: supported
            description: The evidence supports a change.
            type: string
          - const: failed
            description: The loop couldn't finish.
            type: string
        verdicts:
          description: What the composer found, checked.
          items:
            $ref: "#/components/schemas/Checked"
          maxItems: 8
          type: array
      required:
      - request
      - started_at
      - finished_at
      - candidates
      - verdicts
      - status
      - problems
      - cost_usd_micros
      type: object
    AttemptList:
      additionalProperties: false
      description: One page of attempts, oldest first.
      properties:
        has_more:
          description: True if there are more past this page.
          type: boolean
        items:
          description: The attempts.
          items:
            $ref: "#/components/schemas/AttemptView"
          maxItems: 200
          type: array
      required:
      - items
      - has_more
      type: object
    AttemptListEffect:
      description: How a candidate's run compares with the reference.
      oneOf:
      - const: mitigated
        description: It fixed something that went wrong.
        type: string
      - const: unchanged
        description: No difference that matters.
        type: string
      - const: regressed
        description: It did something worse.
        type: string
    AttemptView:
      additionalProperties: false
      description: A kept attempt, as the API shows it.
      properties:
        attempt:
          $ref: "#/components/schemas/Attempt"
          description: What it found.
        id:
          description: Its id.
          maxLength: 36
          type: string
      required:
      - id
      - attempt
      type: object
    Budget:
      additionalProperties: false
      description: |-
        What one run may use. Every field is required: a run doesn't get an
        unlimited anything by leaving it out. Calls are capped at 512 so a receipt
        is always bounded.
      properties:
        max_duration_ms:
          description: Wall-clock time.
          minimum: 1
          type: integer
        max_request_bytes:
          description: The size of one request to a model.
          minimum: 1
          type: integer
        max_rounds:
          description: Model calls.
          maximum: 512
          minimum: 1
          type: integer
        max_tool_calls:
          description: Tool calls, including the ones refused.
          maximum: 512
          minimum: 0
          type: integer
        max_total_tokens:
          description: Tokens read and written across all model calls.
          minimum: 1
          type: integer
        max_usd_micros:
          description: Money, in millionths of a dollar.
          minimum: 0
          type: integer
        max_writes:
          description: Tool calls that write.
          maximum: 512
          minimum: 0
          type: integer
      required:
      - max_rounds
      - max_tool_calls
      - max_writes
      - max_total_tokens
      - max_usd_micros
      - max_request_bytes
      - max_duration_ms
      type: object
    BudgetKind:
      description: Which limit a run hit. A closed list.
      oneOf:
      - const: rounds
        description: Model calls.
        type: string
      - const: tool_calls
        description: Tool calls.
        type: string
      - const: writes
        description: Writes.
        type: string
      - const: tokens
        description: Tokens.
        type: string
      - const: spend
        description: Money.
        type: string
      - const: request_size
        description: Request size.
        type: string
      - const: time
        description: Time.
        type: string
      - const: stopped
        description: The runtime was stopping, so the run ended early.
        type: string
    CallStatus:
      description: What became of one tool call.
      oneOf:
      - const: ran
        description: It ran and returned a valid result.
        type: string
      - const: refused
        description: It was refused and never started.
        type: string
      - const: failed
        description: It started and failed, so it may have had effects.
        type: string
      - const: timed_out
        description: It started and ran out of time, so it may have had effects.
        type: string
      - const: stubbed
        description: |-
          It passed every check, but the run is a probe, so it didn't run and
          nothing happened.
        type: string
    CallerRole:
      description: "Who a caller is: the owner, or a person with a role."
      oneOf:
      - const: viewer
        description: A viewer.
        type: string
      - const: member
        description: A member.
        type: string
      - const: admin
        description: An admin.
        type: string
      - const: owner
        description: The owner, with the owner key.
        type: string
    CallerView:
      additionalProperties: false
      description: Who a request came from, and what its key may do.
      properties:
        actor:
          description: "The actor on what it starts: `owner`, or a person's id."
          maxLength: 64
          type: string
        key:
          description: The key's id. None for the owner key.
          maxLength: 36
          type:
          - string
          - "null"
        role:
          $ref: "#/components/schemas/CallerRole"
          description: The owner, or the person's role.
        scopes:
          description: "What the key may do now: its scopes that the role allows."
          items:
            $ref: "#/components/schemas/Scope"
          maxItems: 4
          type: array
      required:
      - actor
      - role
      - scopes
      type: object
    Candidate:
      additionalProperties: false
      description: One candidate and what became of it.
      properties:
        change:
          description: What changed, as the editor put it.
          maxLength: 1000
          type: string
        cites:
          description: The editor's evidence that held.
          items:
            $ref: "#/components/schemas/Cite"
          maxItems: 8
          type: array
        dropped:
          default: []
          description: |-
            The editor's citations that didn't hold, and why. They count for
            nothing.
          items:
            maxLength: 2048
            type: string
          maxItems: 8
          type: array
        guardrails:
          description: Its guardrails, all of them.
          items:
            $ref: "#/components/schemas/Guardrail"
          maxItems: 16
          type: array
        kind:
          $ref: "#/components/schemas/Kind"
          description: What it is.
        label:
          description: Its run label.
          maxLength: 4
          type: string
        probe:
          anyOf:
          - $ref: "#/components/schemas/Probed"
          - type: "null"
          description: Its probe, if it was tried.
        refused:
          description: Why it wasn't tried, if it wasn't.
          maxLength: 2048
          type:
          - string
          - "null"
        skills:
          description: Its skills, all of them.
          items:
            $ref: "#/components/schemas/Skill"
          maxItems: 16
          type: array
        steps:
          description: For a workflow, its step edits. Its instructions are empty.
          items:
            $ref: "#/components/schemas/StepEdit"
          maxItems: 32
          type: array
        system_prompt:
          description: Its instructions.
          maxLength: 16000
          type: string
      required:
      - label
      - kind
      - system_prompt
      - change
      - cites
      type: object
    Change:
      additionalProperties: false
      description: One change the system made to an agent's file.
      properties:
        agent:
          description: The agent, or the workflow.
          maxLength: 64
          type: string
        at:
          description: When it was made.
          format: date-time
          type: string
        attempt_id:
          description: The attempt whose evidence supports it.
          maxLength: 36
          type: string
        ended_at:
          description: When it stopped being live, if it has.
          format: date-time
          type:
          - string
          - "null"
        evidence:
          description: The checked steps that show the change helped.
          items:
            $ref: "#/components/schemas/Cite"
          maxItems: 8
          type: array
        from_harness:
          description: The harness it replaced.
          maxLength: 64
          type: string
        judge_model:
          description: The judge model whose decision it was.
          maxLength: 256
          type: string
        new_file:
          description: The file as the system wrote it.
          maxLength: 64000
          type: string
        notice:
          description: Whether the owner was told, and how.
          maxLength: 2048
          type: string
        old_file:
          description: The file as it was, so it can be put back exactly.
          maxLength: 64000
          type: string
        status:
          description: Where it stands.
          oneOf:
          - const: pending
            description: |-
              Recorded before its file is written, so no edit goes unrecorded. It
              becomes live once the file is in place; if the runtime stopped in
              between, it's in effect exactly when the agent's harness is its own.
            type: string
          - const: abandoned
            description: Its file never went in.
            type: string
          - const: live
            description: The agent runs with it.
            type: string
          - const: reverted
            description: The owner put the old file back.
            type: string
          - const: replaced
            description: A later change, or the owner's own edit, took its place.
            type: string
        summary:
          description: What changed, as the editor put it.
          maxLength: 1000
          type: string
        target:
          description: "What it is: an agent unless it says otherwise."
          oneOf:
          - const: agent
            description: An agent.
            type: string
          - const: workflow
            description: A workflow.
            type: string
        to_harness:
          description: The harness it put in place.
          maxLength: 64
          type: string
      required:
      - agent
      - attempt_id
      - at
      - from_harness
      - to_harness
      - old_file
      - new_file
      - summary
      - evidence
      - judge_model
      - status
      - notice
      type: object
    ChangeList:
      additionalProperties: false
      description: One page of changes, oldest first.
      properties:
        has_more:
          description: True if there are more past this page.
          type: boolean
        items:
          description: The changes.
          items:
            $ref: "#/components/schemas/ChangeView"
          maxItems: 200
          type: array
      required:
      - items
      - has_more
      type: object
    ChangeView:
      additionalProperties: false
      description: A change the system made to an agent, as the API shows it.
      properties:
        change:
          $ref: "#/components/schemas/Change"
          description: The change.
        id:
          description: Its id, which reverting it takes.
          maxLength: 36
          type: string
      required:
      - id
      - change
      type: object
    Checked:
      additionalProperties: false
      description: A verdict and whether its evidence held.
      properties:
        overridden:
          anyOf:
          - $ref: "#/components/schemas/AttemptListEffect"
          - type: "null"
          description: |-
            Set when the code overrode the verdict, such as a run that ended worse
            than the reference whatever the composer said.
        refused:
          description: |-
            Why the evidence didn't hold, if it didn't. Such a verdict counts for
            nothing.
          maxLength: 2048
          type:
          - string
          - "null"
        verdict:
          $ref: "#/components/schemas/Verdict"
          description: What the composer said.
      required:
      - verdict
      type: object
    Cite:
      additionalProperties: false
      description: A step in a run, and the words in it that show something.
      properties:
        quote:
          description: Words copied exactly from that step.
          maxLength: 300
          minLength: 1
          type: string
        run:
          description: The run's label, such as `R`.
          maxLength: 4
          minLength: 1
          type: string
        step:
          description: The step's number in that run.
          maximum: 4096
          minimum: 0
          type: integer
      required:
      - run
      - step
      - quote
      type: object
    Decision:
      description: What the composer decided.
      oneOf:
      - const: keep
        description: Change nothing.
        type: string
      - const: adopt
        description: Take one candidate.
        type: string
      - const: merge
        description: Take a merge of two.
        type: string
    DefinitionList:
      additionalProperties: false
      description: One page of definitions, by name.
      properties:
        has_more:
          description: True if there are more past this page.
          type: boolean
        items:
          description: The definitions.
          items:
            $ref: "#/components/schemas/DefinitionView"
          maxItems: 200
          type: array
      required:
      - items
      - has_more
      type: object
    DefinitionView:
      additionalProperties: false
      description: A definition, as the API shows it.
      properties:
        body:
          description: What it says.
          x-extension: the definition, which met its own schema when loaded
        name:
          description: Its name.
          maxLength: 64
          type: string
        source:
          description: Where it came from.
          maxLength: 256
          type: string
        updated_at:
          description: When it was last written.
          format: date-time
          type: string
      required:
      - name
      - source
      - updated_at
      - body
      type: object
    Effect:
      description: |-
        What a tool can do to the world. A write counts against the write budget
        and is stubbed when Harness² probes a candidate.
      oneOf:
      - const: read
        description: Only reads.
        type: string
      - const: write
        description: Changes something.
        type: string
    Feedback:
      additionalProperties: false
      description: |-
        The owner's feedback on one run, as it's kept. One per run: marking a run
        again replaces it.
      properties:
        agent:
          description: "What ran: `chat`, `agent:<name>` or `tool:<name>`."
          maxLength: 128
          type: string
        at:
          description: When it was given.
          format: date-time
          type: string
        mark:
          $ref: "#/components/schemas/Mark"
          description: Bad or good.
        note:
          default: null
          description: The owner's words, if any.
          maxLength: 2048
          type:
          - string
          - "null"
        run:
          description: The run.
          maxLength: 36
          type: string
      required:
      - run
      - agent
      - mark
      - at
      type: object
    FeedbackRequest:
      additionalProperties: false
      description: Feedback on a run, as `PUT /api/v1/runs/{id}/feedback` takes it.
      properties:
        mark:
          $ref: "#/components/schemas/Mark"
          description: Bad or good.
        note:
          default: null
          description: |-
            What was wrong, or right, in the owner's words. Harness²'s editor
            reads it as the reported problem.
          maxLength: 2048
          minLength: 1
          type:
          - string
          - "null"
      required:
      - mark
      type: object
    FellBack:
      additionalProperties: false
      description: "A model a call passed over: it failed, or it was cooling."
      properties:
        model:
          description: The model.
          maxLength: 256
          type: string
        reason:
          description: |-
            `rate_limited`, `timeout`, `unreachable`, `server_error`, `refused`,
            `bad_reply`, or `cooling` for one left alone after failing lately.
          maxLength: 32
          type: string
      required:
      - model
      - reason
      type: object
    Guardrail:
      additionalProperties: false
      description: A rule on one of the agent's tools.
      properties:
        action:
          anyOf:
          - $ref: "#/components/schemas/ArgumentMatch"
          - type: "null"
          description: The calls of the tool its rules are about. Left out, all of them.
        because:
          description: Why, as the model is told when the rule stops it.
          maxLength: 500
          minLength: 1
          type: string
        claimed:
          description: |-
            The same as `required`, but only for an answer this pattern matches,
            ignoring case: what the answer says the tool did, such as
            `\b(saved|stored)\b`.
          maxLength: 256
          minLength: 1
          type:
          - string
          - "null"
        deny:
          anyOf:
          - $ref: "#/components/schemas/ArgumentMatch"
          - type: "null"
          description: Refuses a call whose argument matches.
        max_calls:
          description: Refuses the agent's calls past this many.
          maximum: 1000
          minimum: 1
          type:
          - integer
          - "null"
        name:
          description: Its name, unique within the agent. A call it refuses names it.
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        required:
          description: The agent must call the tool, and see it run, before it answers.
          type: boolean
        tool:
          description: "The tool it holds to the rule: one the agent has."
          maxLength: 64
          minLength: 1
          type: string
      required:
      - name
      - tool
      - because
      type: object
    Hold:
      additionalProperties: false
      description: An agent the system leaves alone until the owner releases it.
      properties:
        agent:
          description: The agent, or the workflow.
          maxLength: 64
          minLength: 1
          type: string
        reason:
          description: Why.
          maxLength: 2048
          type: string
        since:
          description: Since when.
          format: date-time
          type: string
        target:
          description: "What it is: an agent unless it says otherwise."
          oneOf:
          - const: agent
            description: An agent.
            type: string
          - const: workflow
            description: A workflow.
            type: string
      required:
      - agent
      - since
      - reason
      type: object
    HoldList:
      additionalProperties: false
      description: The agents the system leaves alone.
      properties:
        has_more:
          description: True if there are more past this page.
          type: boolean
        items:
          description: The holds.
          items:
            $ref: "#/components/schemas/Hold"
          maxItems: 200
          type: array
      required:
      - items
      - has_more
      type: object
    HoldRequest:
      additionalProperties: false
      description: |-
        Holds an agent, or a workflow with `?target=workflow`, as a release
        says it.
      properties:
        reason:
          description: Why, for whoever reads the hold later.
          maxLength: 2048
          minLength: 1
          type: string
      required:
      - reason
      type: object
    JobList:
      additionalProperties: false
      description: One page of jobs, newest first.
      properties:
        has_more:
          description: True if there are more past this page.
          type: boolean
        items:
          description: The jobs.
          items:
            $ref: "#/components/schemas/JobView"
          maxItems: 200
          type: array
      required:
      - items
      - has_more
      type: object
    JobStatusView:
      description: Where a job stands.
      oneOf:
      - const: queued
        description: Waiting to run.
        type: string
      - const: claimed
        description: Running.
        type: string
      - const: succeeded
        description: It finished.
        type: string
      - const: dead
        description: It failed and has no attempts left.
        type: string
    JobView:
      additionalProperties: false
      description: A job, as the API shows it.
      properties:
        attempts:
          description: How many times it has been claimed.
          minimum: 0
          type: integer
        id:
          description: Its id.
          maxLength: 36
          type: string
        kind:
          description: What kind of work it is.
          maxLength: 64
          type: string
        last_error:
          description: Why the last attempt failed.
          maxLength: 2048
          type:
          - string
          - "null"
        max_attempts:
          description: How many claims it may have.
          minimum: 0
          type: integer
        payload:
          description: Its input.
          x-extension: the job kind's own payload
        priority:
          description: Higher runs first.
          type: integer
        requested_by:
          description: Who asked for it.
          maxLength: 256
          type: string
        result:
          description: What it produced, or what a failed attempt left behind.
          x-extension: the job kind's own result
        run_at:
          description: The earliest it may run.
          format: date-time
          type: string
        status:
          $ref: "#/components/schemas/JobStatusView"
          description: Where it stands.
      required:
      - id
      - kind
      - payload
      - priority
      - status
      - requested_by
      - run_at
      - attempts
      - max_attempts
      type: object
    KeyList:
      additionalProperties: false
      description: A page of keys, oldest first.
      properties:
        has_more:
          description: True if there are more past this page.
          type: boolean
        items:
          description: The keys.
          items:
            $ref: "#/components/schemas/KeyView"
          maxItems: 200
          type: array
      required:
      - items
      - has_more
      type: object
    KeyMade:
      additionalProperties: false
      description: |-
        A key just made, with its secret. This is the only time the secret is
        shown.
      properties:
        key:
          $ref: "#/components/schemas/KeyView"
          description: The key.
        secret:
          description: "What to send as the bearer token: `exk_`, the id and the secret."
          maxLength: 128
          type: string
      required:
      - key
      - secret
      type: object
    KeyRequest:
      additionalProperties: false
      description: A key to make.
      properties:
        expires_at:
          default: null
          description: When it stops working. It never does if left out.
          format: date-time
          type:
          - string
          - "null"
        name:
          description: What it's for, such as "Claude Code on the desktop".
          maxLength: 128
          minLength: 1
          type: string
        person:
          description: "Whose it is: `person:` and their slug."
          maxLength: 55
          pattern: ^person:[a-z0-9][a-z0-9-]{0,47}$
          type: string
        scopes:
          description: What it may be used for. Each must be one the person's role allows.
          items:
            $ref: "#/components/schemas/Scope"
          maxItems: 4
          minItems: 1
          type: array
      required:
      - person
      - scopes
      - name
      type: object
    KeyView:
      additionalProperties: false
      description: "A key, as the API shows it: never its secret."
      properties:
        expires_at:
          description: When it stops working, if it was given an end.
          format: date-time
          type:
          - string
          - "null"
        id:
          description: Its id, the part of the key after `exk_` and before the secret.
          maxLength: 36
          type: string
        last_used_at:
          description: When it was last used, to the minute. None if it never was.
          format: date-time
          type:
          - string
          - "null"
        made_at:
          description: When it was made.
          format: date-time
          type: string
        name:
          description: What it's for, such as "Claude Code on the desktop".
          maxLength: 128
          type: string
        person:
          description: Whose it is.
          maxLength: 55
          type: string
        revoked_at:
          description: When it was revoked, if it was.
          format: date-time
          type:
          - string
          - "null"
        scopes:
          description: What it may be used for, as far as its person's role allows.
          items:
            $ref: "#/components/schemas/Scope"
          maxItems: 4
          type: array
      required:
      - id
      - person
      - scopes
      - name
      - made_at
      type: object
    Kind:
      description: What a candidate is.
      oneOf:
      - const: invariant
        description: How the agent works.
        type: string
      - const: domain
        description: What it knows.
        type: string
      - const: merged
        description: Two candidates combined.
        type: string
    Lesson:
      additionalProperties: false
      description: What one adopted change taught.
      properties:
        agent:
          description: The agent that was changed, or the workflow.
          maxLength: 64
          type: string
        at:
          description: When it was adopted.
          format: date-time
          type: string
        change_id:
          description: The change that taught it.
          maxLength: 36
          type: string
        evidence:
          description: The moments in the runs that supported it.
          items:
            $ref: "#/components/schemas/Cite"
          maxItems: 8
          type: array
        lesson:
          description: What was changed, as the editor put it.
          maxLength: 1000
          type: string
        situation:
          description: "When it applies: the task, and the problem reported, if one was."
          maxLength: 2400
          type: string
        status:
          $ref: "#/components/schemas/LessonStatus"
          description: Whether it still counts.
        target:
          description: "What it is: an agent unless it says otherwise."
          oneOf:
          - const: agent
            description: An agent.
            type: string
          - const: workflow
            description: A workflow.
            type: string
      required:
      - agent
      - change_id
      - at
      - situation
      - lesson
      - evidence
      - status
      type: object
    LessonList:
      additionalProperties: false
      description: One page of the lesson library, oldest first.
      properties:
        has_more:
          description: True if there are more past this page.
          type: boolean
        items:
          description: The lessons.
          items:
            $ref: "#/components/schemas/Lesson"
          maxItems: 200
          type: array
      required:
      - items
      - has_more
      type: object
    LessonStatus:
      description: Whether a lesson still counts.
      oneOf:
      - const: active
        description: Its change is in effect.
        type: string
      - const: retired
        description: Its change was reverted or edited away, so it no longer counts.
        type: string
    Mark:
      description: What the owner thought of a run.
      oneOf:
      - const: bad
        description: It went wrong. Harness² treats the run as evidence for an attempt.
        type: string
      - const: good
        description: It went right. Kept, and not yet used.
        type: string
    ModelEntry:
      additionalProperties: false
      description: One model call, as it really went.
      properties:
        cost_usd_micros:
          description: What it cost, in millionths of a dollar.
          minimum: 0
          type: integer
        detail:
          description: What went wrong, when nothing answered.
          maxLength: 512
          type:
          - string
          - "null"
        failed_attempts:
          description: How many models failed before this one, or failed altogether.
          minimum: 0
          type: integer
        input_tokens:
          description: Tokens read.
          minimum: 0
          type: integer
        model:
          description: The model that answered; absent if none did.
          maxLength: 64
          type:
          - string
          - "null"
        output_tokens:
          description: Tokens written.
          minimum: 0
          type: integer
        tokens_estimated:
          description: True if the server didn't report usage, so these are estimates.
          type: boolean
      required:
      - input_tokens
      - output_tokens
      - tokens_estimated
      - cost_usd_micros
      - failed_attempts
      type: object
    OpenAiRequest:
      description: |-
        What an `OpenAI` client sends. Being someone else's format, fields it
        doesn't use are ignored. Any that would change the meaning of the reply are
        read, so they can be refused rather than quietly ignored.
      properties:
        max_completion_tokens:
          description: The same, under the newer name.
          maximum: 1000000
          minimum: 1
          type:
          - integer
          - "null"
        max_tokens:
          description: The longest each reply may be. The server's own limit still applies.
          maximum: 1000000
          minimum: 1
          type:
          - integer
          - "null"
        messages:
          description: The conversation so far, ending with the user.
          items:
            $ref: "#/components/schemas/WireMessage"
          maxItems: 512
          minItems: 1
          type: array
        model:
          description: Must be the model `/v1/models` lists.
          maxLength: 256
          minLength: 1
          type: string
        "n":
          description: How many replies. Only 1.
          maximum: 1
          minimum: 1
          type:
          - integer
          - "null"
        response_format:
          anyOf:
          - type: "null"
          - additionalProperties: false
            properties:
              type:
                const: text
            required:
            - type
            type: object
          default: null
          description: "Only plain text replies: `{\"type\": \"text\"}`, or left out."
        stream:
          description: Send the reply as server-sent events.
          type:
          - boolean
          - "null"
        temperature:
          description: Sampling temperature.
          maximum: 2.0
          minimum: 0.0
          type:
          - number
          - "null"
        tools:
          anyOf:
          - type: "null"
          - maxItems: 0
            type: array
          default: null
          description: "Must be empty or left out: this server runs its own tools."
      required:
      - model
      - messages
      type: object
      x-extension: a client's other fields are ignored
    Outcome:
      description: How a run ended. A closed list; every run ends in exactly one.
      oneOf:
      - const: answered
        description: The model gave an answer.
        type: string
      - const: refused
        description: The request was refused.
        type: string
      - const: budget_hit
        description: A budget ran out.
        type: string
      - const: tool_failed
        description: A tool failed and the run couldn't go on.
        type: string
      - const: model_failed
        description: No model could answer.
        type: string
      - const: direct
        description: One tool call made directly, with no model involved.
        type: string
    PersonList:
      additionalProperties: false
      description: A page of people, by slug.
      properties:
        has_more:
          description: True if there are more past this page.
          type: boolean
        items:
          description: The people.
          items:
            $ref: "#/components/schemas/PersonView"
          maxItems: 200
          type: array
      required:
      - items
      - has_more
      type: object
    PersonRequest:
      additionalProperties: false
      description: |-
        A person to add, or what to change about one. People are never deleted,
        so an actor on an old record always resolves; disable one instead.
      properties:
        disabled:
          default: false
          description: Whether their keys stop working. False if left out.
          type: boolean
        name:
          description: Their name, for showing.
          maxLength: 128
          minLength: 1
          type: string
        role:
          $ref: "#/components/schemas/Role"
          description: What they may do.
      required:
      - name
      - role
      type: object
    PersonView:
      additionalProperties: false
      description: A person, as kept and as the API shows them.
      properties:
        disabled:
          description: A disabled person's keys all stop working.
          type: boolean
        id:
          description: |-
            `person:` and their slug. It's the actor on what they start, and is
            never reused.
          maxLength: 55
          pattern: ^person:[a-z0-9][a-z0-9-]{0,47}$
          type: string
        made_at:
          description: When they were added.
          format: date-time
          type: string
        made_by:
          description: Who added them.
          maxLength: 64
          type: string
        name:
          description: Their name, for showing.
          maxLength: 128
          minLength: 1
          type: string
        role:
          $ref: "#/components/schemas/Role"
          description: What they may do.
      required:
      - id
      - name
      - role
      - disabled
      - made_at
      - made_by
      type: object
    Probed:
      additionalProperties: false
      description: A probe, in brief. Its trajectory has the rest.
      properties:
        calls:
          description: Its calls line.
          maxLength: 4200
          type: string
        harness:
          description: The harness it ran under.
          maxLength: 64
          type: string
        outcome:
          description: How it ended.
          maxLength: 32
          type:
          - string
          - "null"
        run:
          description: The run. For a workflow, its first step's.
          maxLength: 36
          type: string
        runs:
          description: For a workflow, each step's run, in order.
          items:
            maxLength: 36
            type: string
          maxItems: 64
          type: array
      required:
      - run
      - harness
      - calls
      type: object
    ProblemView:
      additionalProperties: false
      description: One thing wrong with a request.
      properties:
        message:
          description: What's wrong there.
          maxLength: 1024
          type: string
        path:
          description: Where in the request, as a JSON pointer.
          maxLength: 1024
          type: string
      required:
      - path
      - message
      type: object
    Receipt:
      additionalProperties: false
      description: What a run did. It goes out with the answer.
      properties:
        answer_cut_off:
          description: True if the answer was cut off at the output limit.
          type: boolean
        budget_hit:
          anyOf:
          - $ref: "#/components/schemas/BudgetKind"
          - type: "null"
          description: Which limit it hit, if it hit one.
        calls_not_recorded:
          description: Calls made after a budget ran out. Refused, and only counted here.
          minimum: 0
          type: integer
        events_lost:
          description: How many events the sink lost. The trajectory is incomplete if not 0.
          minimum: 0
          type: integer
        guardrails_unmet:
          description: |-
            Guardrails the answer came without: required ones whose tool never
            ran for the agent, and claimed ones whose claim the answer made
            without the call.
          items:
            maxLength: 64
            type: string
          maxItems: 16
          type: array
        model_calls:
          description: Every model call.
          items:
            $ref: "#/components/schemas/ModelEntry"
          maxItems: 512
          type: array
        outcome:
          $ref: "#/components/schemas/Outcome"
          description: How it ended.
        run:
          description: The run.
          maxLength: 64
          type: string
        tool_calls:
          description: Every tool call, up to the budget.
          items:
            $ref: "#/components/schemas/ToolEntry"
          maxItems: 512
          type: array
        totals:
          $ref: "#/components/schemas/Totals"
          description: What it used.
      required:
      - run
      - outcome
      - answer_cut_off
      - model_calls
      - tool_calls
      - calls_not_recorded
      - events_lost
      - totals
      type: object
    RefusalKind:
      description: Why a call was refused. A closed list.
      oneOf:
      - const: not_offered
        description: The tool wasn't offered to this run, or doesn't exist.
        type: string
      - const: arguments_too_large
        description: The arguments were larger than any tool accepts.
        type: string
      - const: arguments_not_json
        description: The arguments weren't JSON.
        type: string
      - const: arguments_invalid
        description: The arguments failed the tool's schema.
        type: string
      - const: budget
        description: A budget ran out.
        type: string
    Replay:
      additionalProperties: false
      description: |-
        A supported candidate replayed on other recent tasks of the same agent,
        the agent as it is (`R`) against the candidate (`A`) on each, so an edit
        that fixes one task and breaks others isn't adopted.
      properties:
        finished:
          description: True if every task got a checked verdict. Adoption needs it.
          type: boolean
        regressed:
          description: True if the candidate did worse on one.
          type: boolean
        tasks:
          description: Each task, in the order it was replayed.
          items:
            $ref: "#/components/schemas/Replayed"
          maxItems: 8
          type: array
      required:
      - tasks
      - regressed
      - finished
      type: object
    Replayed:
      additionalProperties: false
      description: One task of a replay.
      properties:
        candidate:
          anyOf:
          - $ref: "#/components/schemas/Probed"
          - type: "null"
          description: The candidate, on the task.
        problem:
          description: What stopped it, if something did.
          maxLength: 2048
          type:
          - string
          - "null"
        reference:
          anyOf:
          - $ref: "#/components/schemas/Probed"
          - type: "null"
          description: The agent as it is, on the task.
        task:
          description: The task.
          maxLength: 8000
          type: string
        verdict:
          anyOf:
          - $ref: "#/components/schemas/Checked"
          - type: "null"
          description: The composer's verdict on the candidate, checked.
      required:
      - task
      type: object
    Request:
      additionalProperties: false
      allOf:
      - else:
          properties:
            inputs: false
            task:
              pattern: \S
          required:
          - task
        if:
          properties:
            target:
              const: workflow
          required:
          - target
        then:
          properties:
            inputs:
              type: object
            routed:
              const: false
            task:
              maxLength: 0
          required:
          - inputs
      description: What to improve.
      properties:
        agent:
          description: The agent, or the workflow when `target` is `workflow`.
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9_-]{1,64}$
          type: string
        inputs:
          additionalProperties: true
          description: |-
            For a workflow: the inputs to run it on, checked against its inputs
            schema.
          type:
          - object
          - "null"
          x-extension: checked against the workflow's inputs schema
        routed:
          description: |-
            True to probe the agent as the routed chat runs it, as a profile or
            the writer, rather than as a conversation.
          type: boolean
        target:
          description: "What to improve: an agent unless it says otherwise."
          oneOf:
          - const: agent
            description: An agent.
            type: string
          - const: workflow
            description: A workflow.
            type: string
        task:
          description: "For an agent: a task to run it on, such as one a real run got wrong."
          maxLength: 8000
          type: string
        why:
          description: What went wrong, if someone said.
          maxLength: 2000
          type:
          - string
          - "null"
      required:
      - agent
      type: object
    Role:
      description: "What a person may do: the most their keys' scopes can open."
      oneOf:
      - const: viewer
        description: Reads.
        type: string
      - const: member
        description: Reads, chats and runs workflows.
        type: string
      - const: admin
        description: Everything but people and keys, which are the owner's.
        type: string
    RunList:
      additionalProperties: false
      description: One page of runs, newest first.
      properties:
        has_more:
          description: True if there are more past this page.
          type: boolean
        items:
          description: The runs.
          items:
            $ref: "#/components/schemas/RunView"
          maxItems: 200
          type: array
      required:
      - items
      - has_more
      type: object
    RunRequest:
      additionalProperties: false
      description: Starts a workflow.
      properties:
        idempotency_key:
          description: Send the same key again and no second run starts, so a retry is safe.
          maxLength: 128
          minLength: 1
          type:
          - string
          - "null"
        inputs:
          description: Its inputs, which must fit what it declares.
          x-extension: checked against the workflow's inputs schema
        priority:
          default: 0
          description: Higher runs first.
          maximum: 1000
          minimum: -1000
          type: integer
      required:
      - inputs
      type: object
    RunStarted:
      additionalProperties: false
      description: A run that was asked for.
      properties:
        already_existed:
          description: True if this key had already started it, and nothing new was queued.
          type: boolean
        job_id:
          description: The job to look at for how it went.
          maxLength: 36
          type: string
      required:
      - job_id
      - already_existed
      type: object
    RunView:
      additionalProperties: false
      description: A run, as the API lists it.
      properties:
        agent:
          description: "What ran: `chat`, `agent:<name>` or `tool:<name>`."
          maxLength: 128
          type: string
        ended_at:
          description: When it ended. None while it runs, or if it was cut short.
          format: date-time
          type:
          - string
          - "null"
        harness:
          description: |-
            The harness it ran under. Runs with the same id had the same
            instructions, tools and limits.
          maxLength: 64
          type: string
        outcome:
          description: How it ended.
          maxLength: 32
          type:
          - string
          - "null"
        run:
          description: Its id, which `GET /api/v1/runs/{id}` takes.
          maxLength: 36
          type: string
        started_at:
          description: When it started.
          format: date-time
          type: string
      required:
      - run
      - agent
      - harness
      - started_at
      type: object
    Scope:
      description: What a key may be used for.
      oneOf:
      - const: read
        description: |-
          Read jobs, runs, definitions, Harness² and metrics, and call tools
          that only read.
        type: string
      - const: chat
        description: Chat, through MCP or the front door, and mark a run good or bad.
        type: string
      - const: run
        description: Start workflow runs, and call tools that change something.
        type: string
      - const: admin
        description: Start Harness² attempts, revert its changes and hold agents.
        type: string
    Skill:
      additionalProperties: false
      description: Instructions for some tasks, added when the task matches.
      properties:
        instructions:
          description: What the agent is told when it applies.
          maxLength: 4000
          minLength: 1
          type: string
        name:
          description: Its name, unique within the agent.
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        unless:
          description: When it doesn't, even if `when` matches.
          maxLength: 256
          minLength: 1
          type:
          - string
          - "null"
        when:
          description: |-
            When it applies: a pattern matched against the task as the agent
            receives it, ignoring case.
          maxLength: 256
          minLength: 1
          type: string
      required:
      - name
      - when
      - instructions
      type: object
    Speaker:
      description: Who wrote a message.
      oneOf:
      - const: system
        description: The harness's instructions.
        type: string
      - const: user
        description: The person, or the harness on their behalf.
        type: string
      - const: assistant
        description: The model.
        type: string
      - const: tool
        description: A tool's result.
        type: string
    Step:
      description: One thing in a trajectory.
      oneOf:
      - additionalProperties: false
        description: The run began.
        properties:
          agent:
            description: What ran.
            maxLength: 128
            type: string
          budget:
            $ref: "#/components/schemas/Budget"
            description: Its limits.
          harness:
            description: The harness it ran under.
            maxLength: 64
            type: string
          offered:
            description: The tools it was offered.
            items:
              maxLength: 64
              type: string
            maxItems: 64
            type: array
          purpose:
            description: What the work was for.
            maxLength: 128
            type: string
          skills:
            description: The skills its instructions include.
            items:
              maxLength: 64
              type: string
            maxItems: 16
            type: array
          type:
            const: started
            type: string
        required:
        - type
        - agent
        - harness
        - purpose
        - offered
        - budget
        type: object
      - additionalProperties: false
        description: |-
          A message the model was given: at the start, such as its instructions
          or the question, or later by the harness, such as a guardrail's
          reminder.
        properties:
          content:
            description: Its text, cut if long.
            maxLength: 20000
            type: string
          role:
            $ref: "#/components/schemas/Speaker"
            description: Who wrote it.
          tool_calls:
            description: The tools it called, for a model's message.
            items:
              maxLength: 64
              type: string
            maxItems: 512
            type: array
          type:
            const: message
            type: string
        required:
        - type
        - role
        - content
        type: object
      - additionalProperties: false
        description: A call to a model.
        properties:
          cost_usd_micros:
            description: What it cost, in millionths of a dollar.
            minimum: 0
            type: integer
          duration_ms:
            default: 0
            description: How long the call took, retries and fallbacks included.
            minimum: 0
            type: integer
          error:
            description: Why it failed, if it did.
            maxLength: 2048
            type:
            - string
            - "null"
          fell_back:
            description: |-
              Each model that failed this call, or was passed over while it
              cooled, before the one that answered. Empty in events written
              before 0.12.0.
            items:
              $ref: "#/components/schemas/FellBack"
            maxItems: 32
            type: array
          input_tokens:
            default: 0
            description: |-
              The prompt's tokens, as the model counted them or as estimated.
              Zero on a failed call, and in events written before 0.10.0.
            minimum: 0
            type: integer
          model:
            description: The model that answered, if one did.
            maxLength: 256
            type:
            - string
            - "null"
          output_tokens:
            default: 0
            description: The reply's tokens, likewise.
            minimum: 0
            type: integer
          reply:
            description: What it said, cut if long.
            maxLength: 20000
            type:
            - string
            - "null"
          tool_calls:
            description: How many tools it asked for.
            minimum: 0
            type: integer
          type:
            const: model
            type: string
        required:
        - type
        - tool_calls
        - cost_usd_micros
        type: object
      - additionalProperties: false
        description: A call to a tool, whether it ran or was refused.
        properties:
          arguments:
            description: The arguments as sent, cut if long.
            maxLength: 20000
            type: string
          by_harness:
            description: True when the harness made the call, not the model.
            type: boolean
          duration_ms:
            description: How long it ran.
            minimum: 0
            type: integer
          effect:
            anyOf:
            - $ref: "#/components/schemas/Effect"
            - type: "null"
            description: Whether it reads or writes, once known.
          index:
            description: Its place among the run's tool calls, from 0.
            minimum: 0
            type: integer
          refusal:
            anyOf:
            - $ref: "#/components/schemas/RefusalKind"
            - type: "null"
            description: Why it was refused, if it was.
          reply:
            description: What went back to the model, cut if long.
            maxLength: 20000
            type:
            - string
            - "null"
          status:
            $ref: "#/components/schemas/CallStatus"
            description: What became of it.
          tool:
            description: The tool asked for.
            maxLength: 64
            type: string
          type:
            const: tool
            type: string
        required:
        - type
        - index
        - tool
        - status
        - by_harness
        - arguments
        - duration_ms
        type: object
      - additionalProperties: false
        description: |-
          A call a plugin's tool made through a capability, under that tool
          call.
        properties:
          capability:
            description: "`http` or `model`."
            maxLength: 32
            type: string
          cost_usd_micros:
            description: What it cost, in millionths of a dollar.
            minimum: 0
            type: integer
          duration_ms:
            description: How long it took.
            minimum: 0
            type: integer
          ok:
            description: Whether it worked.
            type: boolean
          tool_index:
            description: The tool call's place among the run's tool calls.
            minimum: 0
            type: integer
          type:
            const: capability
            type: string
          what:
            description: The method and address, or the model that answered.
            maxLength: 512
            type: string
        required:
        - type
        - tool_index
        - capability
        - what
        - ok
        - cost_usd_micros
        - duration_ms
        type: object
      - additionalProperties: false
        description: |-
          The routed front door chose a profile, a tool, or whether to make
          another call.
        properties:
          of:
            description: The options it was offered.
            items:
              maxLength: 128
              type: string
            maxItems: 64
            type: array
          picked:
            description: |-
              What was chosen, or `invalid` when the reply named none of the
              options.
            maxLength: 128
            type: string
          profile:
            description: The profile it chose under, once one is chosen.
            maxLength: 128
            type:
            - string
            - "null"
          stage:
            description: "What was chosen: `profile`, `tool` or `next`."
            maxLength: 16
            type: string
          type:
            const: choice
            type: string
        required:
        - type
        - stage
        - picked
        - of
        type: object
      - additionalProperties: false
        description: |-
          The routed front door filled a tool's arguments, and what code
          dropped from them.
        properties:
          dropped:
            description: What was dropped as said by nothing, as JSON; `{}` for nothing.
            maxLength: 4000
            type: string
          kept:
            description: The arguments kept, as JSON, cut if long.
            maxLength: 4000
            type: string
          refilled:
            description: |-
              True when they were filled again, after the first try repeated a
              call already made.
            type: boolean
          tool:
            description: The tool.
            maxLength: 64
            type: string
          type:
            const: arguments
            type: string
        required:
        - type
        - tool
        - kept
        - dropped
        - refilled
        type: object
      - additionalProperties: false
        description: A rule in code changed the routed front door's course.
        properties:
          detail:
            description: What it did.
            maxLength: 500
            type: string
          rule:
            description: "Which: `stored_first`, `no_repeat`, `max_calls`, `invalid_choice`."
            maxLength: 32
            type: string
          type:
            const: rule
            type: string
        required:
        - type
        - rule
        - detail
        type: object
      - additionalProperties: false
        description: The run ended.
        properties:
          budget_hit:
            anyOf:
            - $ref: "#/components/schemas/BudgetKind"
            - type: "null"
            description: The limit it hit, if any.
          cost_usd_micros:
            description: What the whole run cost.
            minimum: 0
            type: integer
          outcome:
            $ref: "#/components/schemas/Outcome"
            description: How.
          type:
            const: ended
            type: string
        required:
        - type
        - outcome
        - cost_usd_micros
        type: object
    StepEdit:
      additionalProperties: false
      description: A change to one step of a workflow.
      properties:
        arguments:
          description: New arguments for a step whose tool only reads.
          x-extension: checked against the tool's input schema
        context:
          description: An agent step's new context.
          maxLength: 4096
          type:
          - string
          - "null"
        id:
          description: The step, by its id.
          maxLength: 64
          minLength: 1
          type: string
        message:
          description: An agent step's new message.
          maxLength: 16000
          minLength: 1
          type:
          - string
          - "null"
      required:
      - id
      type: object
    TimedStep:
      additionalProperties: false
      description: A step and when it happened.
      properties:
        at:
          description: When.
          format: date-time
          type: string
        step:
          $ref: "#/components/schemas/Step"
          description: What.
      required:
      - at
      - step
      type: object
    ToolEntry:
      additionalProperties: false
      description: One tool call, as it really went.
      properties:
        by_harness:
          description: True if the harness made this call, and the model didn't ask for it.
          type: boolean
        capability_calls:
          default: 0
          description: |-
            How many calls a plugin's tool made through its capabilities. Each
            counts as a tool call, and each is on the trajectory.
          minimum: 0
          type: integer
        cost_usd_micros:
          description: What it spent, in millionths of a dollar.
          minimum: 0
          type: integer
        detail:
          description: What went wrong, when something did.
          maxLength: 512
          type:
          - string
          - "null"
        duration_ms:
          description: How long it ran.
          minimum: 0
          type: integer
        effect:
          anyOf:
          - $ref: "#/components/schemas/Effect"
          - type: "null"
          description: What the tool can do, when the tool exists.
        guardrail:
          description: |-
            The guardrail that refused it, if one did. Its refusal is
            `arguments_invalid` for an argument it denies and `budget` for a call
            past its limit.
          maxLength: 64
          type:
          - string
          - "null"
        refusal:
          anyOf:
          - $ref: "#/components/schemas/RefusalKind"
          - type: "null"
          description: Why it was refused.
        status:
          $ref: "#/components/schemas/CallStatus"
          description: What became of it.
        tool:
          description: The tool named. A model can invent this, so it's cut to length.
          maxLength: 64
          type: string
        truncated:
          description: Whether the result was cut to fit the channel.
          type: boolean
        untrusted:
          description: Whether the result came from outside and is labelled untrusted.
          type: boolean
      required:
      - tool
      - status
      - truncated
      - untrusted
      - by_harness
      - duration_ms
      - cost_usd_micros
      type: object
    Totals:
      additionalProperties: false
      description: What the run used.
      properties:
        cost_usd_micros:
          description: Money, in millionths of a dollar.
          minimum: 0
          type: integer
        duration_ms:
          description: Wall-clock time.
          minimum: 0
          type: integer
        rounds:
          description: Model calls.
          minimum: 0
          type: integer
        tokens:
          description: Tokens read and written.
          minimum: 0
          type: integer
        tool_calls:
          description: Tool calls, including the ones refused.
          minimum: 0
          type: integer
        writes:
          description: Writes started.
          minimum: 0
          type: integer
      required:
      - rounds
      - tool_calls
      - writes
      - tokens
      - cost_usd_micros
      - duration_ms
      type: object
    Trajectory:
      additionalProperties: false
      description: A run's trajectory.
      properties:
        agent:
          description: What ran, if the run's start was recorded.
          maxLength: 128
          type:
          - string
          - "null"
        calls:
          description: |-
            The run in one line: each tool call and how it went, then how the run
            ended. Read this first; it keeps runs from being confused.
          maxLength: 4200
          type: string
        complete:
          description: False when the run had more steps than were read.
          type: boolean
        harness:
          description: The harness it ran under.
          maxLength: 64
          type:
          - string
          - "null"
        run:
          description: The run.
          maxLength: 36
          type: string
        steps:
          description: What happened, in order.
          items:
            $ref: "#/components/schemas/TimedStep"
          maxItems: 2048
          type: array
        unreadable:
          description: |-
            Events that couldn't be read as steps, such as ones written before
            steps had a schema.
          minimum: 0
          type: integer
      required:
      - run
      - calls
      - steps
      - unreadable
      - complete
      type: object
    Verdict:
      additionalProperties: false
      description: One candidate's verdict.
      properties:
        candidate:
          description: The candidate's run label.
          maxLength: 4
          minLength: 1
          type: string
        cite:
          $ref: "#/components/schemas/Cite"
          description: The step that shows it.
        effect:
          $ref: "#/components/schemas/AttemptListEffect"
          description: How it compares.
      required:
      - candidate
      - effect
      - cite
      type: object
    WireContent:
      anyOf:
      - description: Plain text.
        maxLength: 1000000
        type: string
      - description: A list of parts.
        items:
          $ref: "#/components/schemas/WirePart"
        maxItems: 64
        type: array
      description: A message's content.
    WireMessage:
      description: One message from a client.
      properties:
        content:
          anyOf:
          - $ref: "#/components/schemas/WireContent"
          - type: "null"
          description: What it says.
        role:
          $ref: "#/components/schemas/WireRole"
          description: Who wrote it.
        tool_calls:
          anyOf:
          - type: "null"
          - maxItems: 0
            type: array
          default: null
          description: "Must be empty or left out: this server runs its own tools."
      required:
      - role
      type: object
    WirePart:
      description: One part of a message's content.
      properties:
        text:
          description: The text.
          maxLength: 1000000
          type: string
        type:
          description: Only text is accepted.
          maxLength: 8
          pattern: ^text$
          type: string
      required:
      - type
      - text
      type: object
    WireRole:
      description: Who wrote a message.
      oneOf:
      - const: system
        description: Instructions.
        type: string
      - const: developer
        description: Instructions, under the newer name.
        type: string
      - const: user
        description: The person.
        type: string
      - const: assistant
        description: The model.
        type: string
  securitySchemes:
    bearer:
      description: "The owner key, or a key made for a person (exk_...). Each operation names the scope its key needs: read, chat, run or admin; owner means only the owner key."
      scheme: bearer
      type: http
info:
  license:
    identifier: MIT OR Apache-2.0
    name: MIT OR Apache-2.0
  title: HTTP API
  version: "1"
openapi: "3.1.0"
paths:
  "/api/v1/definitions/{kind}":
    get:
      operationId: list_definitions
      parameters:
      - description: Which kind of definition.
        in: path
        name: kind
        required: true
        schema:
          enum:
          - agent
          - workflow
          - schedule
          type: string
      - description: How many to return, 1 to 200. 50 if left out.
        in: query
        name: limit
        required: false
        schema:
          maximum: 200
          minimum: 1
          type: integer
      - description: How many to skip first.
        in: query
        name: offset
        required: false
        schema:
          maximum: 4294967295
          minimum: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionList"
          description: A page of definitions.
        4XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Refused: the request, the key, or what it names. The body says why."
        5XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: The server failed, or is busy. The body says which.
      security:
      - bearer:
        - read
      summary: "The definitions of one kind: agent, workflow or schedule"
  "/api/v1/definitions/{kind}/{name}":
    get:
      operationId: get_definition
      parameters:
      - description: Which kind of definition.
        in: path
        name: kind
        required: true
        schema:
          enum:
          - agent
          - workflow
          - schedule
          type: string
      - description: ""
        in: path
        name: name
        required: true
        schema:
          maxLength: 256
          minLength: 1
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionView"
          description: The definition.
        4XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Refused: the request, the key, or what it names. The body says why."
        5XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: The server failed, or is busy. The body says which.
      security:
      - bearer:
        - read
      summary: One definition
  /api/v1/harness/attempts:
    get:
      operationId: list_attempts
      parameters:
