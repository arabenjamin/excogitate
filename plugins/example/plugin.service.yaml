# The same plugin run as its own process. A separate process can't reach the
# runtime's capabilities, so this form has only the tool that needs none.
api_version: 1
name: example
version: 0.0.0
description: Counts words. Copy this to start a plugin that runs as a service.

tools:
  - name: example_word_count
    description: Counts the words in a text.
    effect: read
    input_schema:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, maxLength: 100000 }
    output_schema:
      type: object
      additionalProperties: false
      required: [words]
      properties:
        words: { type: integer, minimum: 0 }
