# Copy to models.yaml and edit. Models are named only here, never in code.
#
# Models are tried cheapest first; among equal prices, in the order below.
version: 1

providers:
  # A server you run yourself. It keeps no logs, so private work may go to it.
  - name: local
    # host.docker.internal is this machine, as seen from the container.
    base_url: http://host.docker.internal:8080/v1
    no_log: true
    timeout_secs: 300

  # A paid cloud endpoint: uncomment this and the large-chat model below, and
  # set max_usd_micros in config.yaml. Anything priced needs a daily cap, and
  # only the purposes listed in paid_for may use it (chat, tool, memory,
  # schedule and workflow).
  # The key is read from the variable named here, and only ever sent to this
  # provider's base_url.
  #
  # - name: cloud
  #   base_url: https://api.example.com/v1
  #   api_key_env: EXCOGITATE_CLOUD_API_KEY
  #   # false means private work never goes here.
  #   no_log: false
  #   timeout_secs: 120
  #   spend_cap_usd_micros_per_day: 1000000 # $1.00
  #   paid_for: [chat]

models:
  - name: small-chat
    provider: local
    wire_model: your-small-model
    # chat, tools, json_schema, embeddings, investigative
    capabilities: [chat, tools, json_schema]
    context_tokens: 16384
    max_output_tokens: 2048

  - name: embedder
    provider: local
    wire_model: your-embedding-model
    capabilities: [embeddings]
    context_tokens: 8192
    max_output_tokens: 1
    # The store's vector width. Changing it is a migration.
    embedding_dimension: 1024

  # investigative means it has been measured able to run a multi-step loop.
  # - name: large-chat
  #   provider: cloud
  #   wire_model: your-large-model
  #   capabilities: [chat, tools, json_schema, investigative]
  #   context_tokens: 128000
  #   max_output_tokens: 8192
  #   price:
  #     input_usd_micros_per_mtok: 500000 # $0.50 per million tokens
  #     output_usd_micros_per_mtok: 1500000 # $1.50 per million tokens

# Roles: a job and the models that do it, in the order to try them. An agent
# asks for one with `role:`, and its calls go to these models in this order
# instead of cheapest first: what's measured best for a job isn't always
# what's cheapest. Every other check (privacy, paid_for, size, budget) still
# applies to each, and a model that's cooling is passed over.
# roles:
#   - name: writer
#     models: [large-chat, small-chat]
