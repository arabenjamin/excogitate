# Copy to config.yaml. Anything left out keeps its default; the reference is
# schemas/v1/config.schema.json.

# How much of each tool result a chat's model sees. Sized for a small model.
max_result_chars: 12000

# What answers chats: a route, a line of workers. A choice of profile (an
# agent, by its description), its tools one at a time with their arguments
# checked in code, then a writer that answers from the results. See
# docs/workflows.md#the-routed-front-door. Left out, every agent that can be
# a profile (a description, one to six tools, no guardrails) is routed, and
# the agent `writer` writes, or system_prompt if there's none.
# front_door:
#   profiles: [notes, jobs, web]
#   writer: writer
#   max_calls: 3
#   max_parts: 2
#   relevance: true
#   choice_role: choice
#   arguments_role: arguments
#   only_when_asked:
#     - {profile: web, asked: '\b(web|online|latest|search)\b', otherwise: notes}

# The longest one workflow run may take, in seconds.
workflow_time_limit_seconds: 1800

# The limits on each run. Give all of them, or leave the whole block out.
# max_usd_micros is 0, so a priced model isn't used until you raise it.
budget:
  max_rounds: 12
  max_tool_calls: 30
  max_writes: 8
  max_total_tokens: 200000
  max_usd_micros: 0
  max_request_bytes: 600000
  max_duration_ms: 300000

# http:
#   # GET and HEAD by default. Any other method can send data out.
#   allowed_methods: [GET, HEAD]
#   # A service on your own network, reachable even though it's private.
#   allowed_ranges: ["192.0.2.10/32"]

# Remote MCP servers whose tools are offered as the runtime's own, each as
# <name>_<tool>. Only the tools listed are reachable; see docs/mcp.md.
# mcp_servers:
#   - name: docs
#     url: https://mcp.example.com/mcp
#     # Its key, from an environment variable, in this header.
#     header: authorization
#     prefix: "Bearer "
#     env: DOCS_MCP_KEY
#     # It keeps nothing it's sent, so private runs may call it.
#     no_log: false
#     tools: [search, fetch_page, save_note]
#     # The rest count as writes.
#     read_only: [search, fetch_page]
#     timeout_seconds: 30
#     max_result_chars: 50000

# server:
#   # How many chats and tool calls run at once. Past this, requests get a 503.
#   max_concurrent_requests: 8
#   # Browser origins allowed to call it. Others are refused.
#   allowed_origins: []
#   # Serve /metrics without the owner key. Only on a private network.
#   open_metrics: false

# harness:
#   # Tools a Harness² probe really runs, for their reads only. Writes never run.
#   probe_reads: [memory]
#   # Reads a routed probe doesn't run. It runs every read its profiles make,
#   # so list the ones that cost money or a quota.
#   routed_probe_skips: []
#   # What the judges may spend on one attempt. They need a model marked
#   # investigative in models.yaml.
#   judge_usd_micros: 0
#   judge_output_tokens: 4000
#   time_limit_seconds: 1800
#   # Other recent tasks a supported edit is replayed on before it's adopted;
#   # a regression stops it. 0 adopts on the one task's evidence.
#   replay_tasks: 3
#   # The harness_review job: how many of the last day's answered chats it
#   # judges, and what it may spend. Both 0 reviews none.
#   review_chats: 0
#   review_usd_micros: 0
#   # Whether it changes an agent's file itself when the evidence supports it.
#   # Every change is logged and can be reverted.
#   adopt: true
#   # Where to post each change as it's made.
#   notify_url: https://example.com/hooks/agent-changes

# retention:
#   # Days a run's trajectory is kept, from its start; null keeps them. At
#   # least 8, so Harness² always has its week of runs.
#   trajectory_days: 30
#   # Days a finished job is kept, from when it finished; null keeps them. At
#   # least 8, since a schedule may fire up to 7 days late.
#   job_days: 30
