[package]
name = "runtime"
description = "Puts the parts together, and serves them over MCP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The Neo4j store, chosen at run time with the STORE setting.
neo4j = ["dep:store-neo4j"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
dispatch = { path = "../dispatch" }
events = { path = "../events" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
harness = { path = "../harness" }
mcp-remote = { path = "../mcp-remote" }
memory = { path = "../memory" }
model = { path = "../model" }
plugin-api = { path = "../plugin-api" }
plugin-host = { path = "../plugin-host" }
prometheus-client = "0.26"
protocol = { path = "../protocol" }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls"] }
schema = { path = "../schema" }
schemars.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2 = "0.10"
store = { path = "../store" }
store-duckdb = { path = "../store-duckdb" }
store-neo4j = { path = "../store-neo4j", optional = true }
subtle = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tools = { path = "../tools" }
uuid = { workspace = true, features = ["v5"] }
work = { path = "../work" }
workflow = { path = "../workflow" }

[dev-dependencies]
chaos-model = { path = "../chaos-model" }
proptest.workspace = true
plugin-example = { path = "../../plugins/example" }
store-memory = { path = "../store-memory" }

[lints]
workspace = true
