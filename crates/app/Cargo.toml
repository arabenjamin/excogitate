[package]
name = "app"
description = "The command-line entry point and server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# One feature per compiled-in plugin. The default build has none.
plugin-example = ["dep:plugin-example"]
# The Neo4j store. A store, not a plugin; DuckDB is the default.
neo4j = ["runtime/neo4j"]

[dependencies]
runtime = { path = "../runtime" }
plugin-api = { path = "../plugin-api" }
plugin-example = { path = "../../plugins/example", optional = true }
tokio.workspace = true

[[bin]]
name = "excogitate"
path = "src/main.rs"

[lints]
workspace = true
